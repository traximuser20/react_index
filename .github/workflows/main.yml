name: Celebrate Commit Milestones 🎉

on:
  push:
    branches:
      - main  # change if your default branch is different

jobs:
  celebrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Count commits
        id: commit_count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "COMMITS=$COUNT" >> $GITHUB_ENV
          echo "Total commits: $COUNT"

      - name: Check if milestone
        id: milestone
        run: |
          # milestone every 500 commits (1000, 1500, 2000, ...)
          if [ $(( $COMMITS % 12 )) -eq 0 ]; then
            echo "MILESTONE_REACHED=true" >> $GITHUB_ENV
          else
            echo "MILESTONE_REACHED=false" >> $GITHUB_ENV
          fi

      - name: Celebrate with fireworks 🎆
        if: env.MILESTONE_REACHED == 'true'
        run: |
          echo "🎉 Milestone reached at $COMMITS commits! Updating README..."
          
          # Insert fireworks + confetti GIF
          sed -i 's|<!-- CELEBRATION_PLACEHOLDER -->|![Fireworks](https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDM5eGZzaWR0cmh4ZXhkdnFidHR5bWJlMHpzZWM3dDZ4cHg5YXAyNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/8It0HNrGjcTT2/giphy.gif) ![Stars](https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTdrMTJzMDMzZjYyYWZrejY2dHQ1a3Zzamh5MDU5dGZ5OHl6c3djOSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/mYTOsQlXJGIeYaZklp/giphy.gif) ![Confetti](https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZXBxbHJndzY2aWJvbXIxMGthM3FocmppZXJzYm9hdHkyYW5yMHQxaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/5jT0jaNDsM6Ik7X9yq/giphy.gif)|' README.md

      - name: Commit changes
        if: env.MILESTONE_REACHED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🎆 Celebrating $COMMITS commits with fireworks & confetti!"
          git push
